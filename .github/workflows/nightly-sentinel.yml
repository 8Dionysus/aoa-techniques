name: Nightly Sentinel

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moving_main:
    name: Moving Main Sentinel
    runs-on: ubuntu-latest
    env:
      ABYSS_MACHINE_REPO_ROOT: ${{ github.workspace }}/.deps/abyss-machine
      AOA_KAG_ROOT: ${{ github.workspace }}/.deps/aoa-kag
      AOA_STATS_ROOT: ${{ github.workspace }}/.deps/aoa-stats
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Checkout abyss-machine artifact tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-machine
          ref: a9f52d8bfe23e28167c01dd2a059af231fff77a0
          path: .deps/abyss-machine

      - name: Checkout aoa-kag index builder
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-kag
          ref: 813a7f69dc96ec031dad9b897a6991792cc48b7a
          path: .deps/aoa-kag

      - name: Checkout aoa-stats protocol validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-stats
          ref: 339ecb2db22ac4552fa88756b650896ebbff5b56
          path: .deps/aoa-stats

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run nightly lane
        run: python scripts/ci_gate.py --mode nightly

  latest_release_repro:
    name: Latest Release Repro
    runs-on: ubuntu-latest
    env:
      ABYSS_MACHINE_REPO_ROOT: ${{ github.workspace }}/.deps/abyss-machine
      AOA_STATS_ROOT: ${{ github.workspace }}/.deps/aoa-stats
    steps:
      - name: Checkout repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Resolve latest release tag
        id: latest
        run: |
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "No v* release tag found" >&2
            exit 1
          fi
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: $latest_tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout latest release tag
        run: git checkout --detach "${{ steps.latest.outputs.tag }}"

      - name: Checkout abyss-machine artifact tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-machine
          ref: a9f52d8bfe23e28167c01dd2a059af231fff77a0
          path: .deps/abyss-machine

      - name: Checkout aoa-stats protocol validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-stats
          ref: 339ecb2db22ac4552fa88756b650896ebbff5b56
          path: .deps/aoa-stats

      - name: Move release dependencies outside tagged checkout
        shell: bash
        run: |
          release_deps="$RUNNER_TEMP/aoa-techniques-release-deps"
          if [ -e "$release_deps" ]; then
            echo "release dependency directory already exists: $release_deps" >&2
            exit 1
          fi
          test -d "$GITHUB_WORKSPACE/.deps/abyss-machine"
          test -d "$GITHUB_WORKSPACE/.deps/aoa-stats"
          mv "$GITHUB_WORKSPACE/.deps" "$release_deps"
          {
            echo "ABYSS_MACHINE_REPO_ROOT=$release_deps/abyss-machine"
            echo "AOA_STATS_ROOT=$release_deps/aoa-stats"
          } >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: python -m pip install -r requirements-dev.txt 'pytest>=8.0,<9.0'

      - name: Reproduce latest release gate
        run: python scripts/release_check.py

name: Release Audit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Exact immutable Techniques release ref to audit"
        required: false
        type: string
        default: ""

concurrency:
  group: release-audit-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: true

jobs:
  release_audit:
    name: Release Audit
    runs-on: ubuntu-latest
    env:
      ABYSS_MACHINE_REPO_ROOT: ${{ github.workspace }}/.deps/abyss-machine
      AOA_STATS_ROOT: ${{ github.workspace }}/.deps/aoa-stats
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Resolve release provider pins from selected checkout
        id: release_dependencies
        shell: bash
        run: |
          stats_ref="$(sed -nE 's/^AOA_STATS_REF = "([0-9a-f]{40})"$/\1/p' scripts/validate_local_stats_port.py)"
          if [ -z "$stats_ref" ] || [ "$(printf '%s\n' "$stats_ref" | wc -l)" -ne 1 ]; then
            echo "selected release does not expose exactly one AOA_STATS_REF" >&2
            exit 1
          fi
          echo "stats_ref=$stats_ref" >> "$GITHUB_OUTPUT"
          echo "Release-scoped aoa-stats ref: $stats_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout abyss-machine artifact tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-machine
          ref: a9f52d8bfe23e28167c01dd2a059af231fff77a0
          path: .deps/abyss-machine

      - name: Checkout aoa-stats protocol validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-stats
          ref: ${{ steps.release_dependencies.outputs.stats_ref }}
          path: .deps/aoa-stats

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run release lane
        run: python scripts/ci_gate.py --mode release

name: Release Audit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Exact immutable Techniques release ref to audit"
        required: false
        type: string
        default: ""

concurrency:
  group: release-audit-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: true

jobs:
  release_audit:
    name: Release Audit
    runs-on: ubuntu-latest
    env:
      ABYSS_MACHINE_REPO_ROOT: ${{ github.workspace }}/.deps/abyss-machine
      AOA_STATS_ROOT: ${{ github.workspace }}/.deps/aoa-stats
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Checkout abyss-machine artifact tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-machine
          ref: a9f52d8bfe23e28167c01dd2a059af231fff77a0
          path: .deps/abyss-machine

      - name: Checkout aoa-stats protocol validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-stats
          ref: 339ecb2db22ac4552fa88756b650896ebbff5b56
          path: .deps/aoa-stats

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run release lane
        run: python scripts/ci_gate.py --mode release
